<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Review Generator</title>
    <!-- Tailwind CSS for modern, responsive card UI -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .option-grid {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 0.5rem;
        }

        .option-card {
            display: flex;
            min-width: 0;
            min-height: 2.5rem;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 0.625rem;
            border: 1px solid #d1d5db;
            border-radius: 0.625rem;
            background: #fff;
            color: #1f2937;
            cursor: pointer;
            transition: background-color 150ms, border-color 150ms, color 150ms;
        }

        .option-card:hover {
            border-color: #93c5fd;
            background: #eff6ff;
        }

        .option-card:has(input:checked) {
            border-color: #2563eb;
            background: #eff6ff;
            color: #1d4ed8;
        }

        .option-card:has(input:focus-visible) {
            outline: 2px solid #60a5fa;
            outline-offset: 2px;
        }

        .option-input {
            position: absolute;
            width: 1px;
            height: 1px;
            overflow: hidden;
            clip: rect(0, 0, 0, 0);
            white-space: nowrap;
            clip-path: inset(50%);
        }

        .option-indicator {
            display: grid;
            width: 1rem;
            height: 1rem;
            flex: 0 0 1rem;
            place-items: center;
            border: 1.5px solid #9ca3af;
            background: #fff;
        }

        .option-radio {
            border-radius: 50%;
        }

        .option-radio::after {
            width: 0.45rem;
            height: 0.45rem;
            border-radius: 50%;
            background: #fff;
            content: "";
            transform: scale(0);
            transition: transform 150ms;
        }

        .option-input:checked + .option-radio {
            border-color: #2563eb;
            background: #2563eb;
        }

        .option-input:checked + .option-radio::after {
            transform: scale(1);
        }

        .option-checkbox {
            border-radius: 0.25rem;
        }

        .option-checkbox::after {
            width: 0.3rem;
            height: 0.55rem;
            border: solid #fff;
            border-width: 0 2px 2px 0;
            content: "";
            opacity: 0;
            transform: rotate(45deg) translate(-1px, -1px);
        }

        .option-input:checked + .option-checkbox {
            border-color: #2563eb;
            background: #2563eb;
        }

        .option-input:checked + .option-checkbox::after {
            opacity: 1;
        }

        .option-label {
            min-width: 0;
            font-size: 0.8125rem;
            line-height: 1.15rem;
        }

        @media (max-width: 420px) {
            .option-grid {
                gap: 0.375rem;
            }

            .option-card {
                gap: 0.375rem;
                padding: 0.375rem;
            }

            .option-label {
                font-size: 0.75rem;
                line-height: 1rem;
            }
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-2 sm:p-4 flex items-center justify-center">
    <div class="max-w-3xl w-full bg-white p-4 sm:p-5 rounded-2xl shadow-lg border border-gray-100">
        <h1 class="text-2xl font-bold mb-4 text-center text-blue-600">Share Your Experience</h1>
        
        <!-- Q1: Treatment (Single Choice) -->
        <div class="mb-4">
            <h2 class="text-base font-semibold mb-2">1. What treatment did you take?</h2>
            <div id="treatments-container" class="option-grid"></div>
        </div>

        <!-- Q2: Doctor (Single Choice) -->
        <div class="mb-4">
            <h2 class="text-base font-semibold mb-2">2. Which doctor did you consult?</h2>
            <div id="doctors-container" class="option-grid"></div>
        </div>

        <!-- Q3: Experience (Multiple Choice) -->
        <div class="mb-5">
            <h2 class="text-base font-semibold mb-2">3. How was your experience? (Select all that apply)</h2>
            <div id="experiences-container" class="option-grid"></div>
        </div>

        <!-- Action Button -->
        <button id="generateBtn" onclick="generateReview()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-md">
            Generate Review
        </button>

        <!-- Dynamic Output Section -->
        <div id="outputSection" class="hidden mt-6">
            <textarea id="reviewText" class="w-full h-32 p-4 border rounded-xl mb-4 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none text-gray-700 shadow-inner" placeholder="Your review will appear here..."></textarea>
            
            <button onclick="copyAndRedirect(event)" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-md flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                Copy and Redirect
            </button>
        </div>
    </div>

    <script>
        // Local files cannot use a relative API path, so send them to the deployed API.
        // When served by FastAPI (locally or on Render), use the same origin.
        const BACKEND_URL = window.location.protocol === "file:"
            ? "https://review-gen-g6cw.onrender.com/generate-review"
            : "/generate-review";
        const REDIRECT_URL = "https://share.google/E7oSDf65O4AwMDyOp";

        // Option datasets
        const treatments = [
            "General Checkup",
            "Root Canal",
            "Teeth Whitening",
            "Dental Implants",
            "Orthodontics",
            "Tooth Extraction"
        ];

        const doctors = [
            "Dr. Sharma",
            "Dr. Patel",
            "Dr. Reddy",
            "Dr. Iyer",
            "Dr. Singh",
            "Dr. Rao"
        ];

        const experiences = [
            "Painless treatment",
            "Friendly staff",
            "Short wait time",
            "Clean environment",
            "Clear explanations",
            "Affordable pricing",
            "Gentle approach",
            "Modern equipment",
            "Great follow-up",
            "Highly recommended"
        ];

        // Fisher-Yates shuffle algorithm
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Render shuffled items into containers on page load
        function renderOptions() {
            // Render Shuffled Treatments
            const treatmentContainer = document.getElementById("treatments-container");
            treatmentContainer.innerHTML = shuffle(treatments).map(t => `
                <label class="option-card">
                    <input type="radio" name="treatment" value="${t}" class="option-input">
                    <span class="option-indicator option-radio" aria-hidden="true"></span>
                    <span class="option-label">${t}</span>
                </label>
            `).join('');

            // Render Shuffled Doctors
            const doctorContainer = document.getElementById("doctors-container");
            doctorContainer.innerHTML = shuffle(doctors).map(d => `
                <label class="option-card">
                    <input type="radio" name="doctor" value="${d}" class="option-input">
                    <span class="option-indicator option-radio" aria-hidden="true"></span>
                    <span class="option-label">${d}</span>
                </label>
            `).join('');

            // Render Shuffled Experiences
            const expContainer = document.getElementById("experiences-container");
            expContainer.innerHTML = shuffle(experiences).map(e => `
                <label class="option-card">
                    <input type="checkbox" name="experience" value="${e}" class="option-input">
                    <span class="option-indicator option-checkbox" aria-hidden="true"></span>
                    <span class="option-label">${e}</span>
                </label>
            `).join('');
        }

        // Trigger shuffle rendering on page load/scan
        window.addEventListener("DOMContentLoaded", renderOptions);

        async function generateReview() {
            const treatment = document.querySelector('input[name="treatment"]:checked');
            const doctor = document.querySelector('input[name="doctor"]:checked');
            const selectedExps = Array.from(document.querySelectorAll('input[name="experience"]:checked')).map(cb => cb.value);

            if (!treatment || !doctor || selectedExps.length === 0) {
                alert("Please select a treatment, a doctor, and at least one experience item.");
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.innerText = "Generating...";
            btn.disabled = true;
            btn.classList.add("opacity-75", "cursor-not-allowed");

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        treatment: treatment.value,
                        doctor: doctor.value,
                        experience: selectedExps
                    })
                });

                if (!response.ok) {
                    const errorData = await response.json();
                    throw new Error(errorData.detail || `Backend request failed (${response.status})`);
                }

                const data = await response.json();
                document.getElementById('reviewText').value = data.review;
                document.getElementById('outputSection').classList.remove('hidden');
            } catch (error) {
                alert(`Failed to generate review: ${error.message}`);
                console.error(error);
            } finally {
                btn.innerText = "Generate Review";
                btn.disabled = false;
                btn.classList.remove("opacity-75", "cursor-not-allowed");
            }
        }

        async function copyAndRedirect(event) {
            const reviewText = document.getElementById('reviewText').value.trim();
            if (!reviewText) return;

            const btn = event.currentTarget;
            btn.disabled = true;
            btn.innerText = "Copying...";

            let clipboardWrite;
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    clipboardWrite = navigator.clipboard.writeText(reviewText);
                }
            } catch (error) {
                console.error("Clipboard API failed:", error);
            }

            let fallbackCopied = false;
            try {
                fallbackCopied = copyTextFallback(reviewText);
            } catch (error) {
                console.error("Clipboard fallback failed:", error);
            }

            if (clipboardWrite) {
                try {
                    await clipboardWrite;
                } catch (error) {
                    if (!fallbackCopied) {
                        console.error("Clipboard API failed:", error);
                        alert("Could not copy the review. Please copy it manually, then try again.");
                        btn.disabled = false;
                        btn.innerText = "Copy and Redirect";
                        return;
                    }
                }
            } else if (!fallbackCopied) {
                alert("Could not copy the review. Please copy it manually, then try again.");
                btn.disabled = false;
                btn.innerText = "Copy and Redirect";
                return;
            }

            btn.innerText = "Copied! Redirecting...";
            window.location.assign(REDIRECT_URL);
        }

        function copyTextFallback(text) {
            const textArea = document.createElement("textarea");
            textArea.value = text;
            textArea.setAttribute("readonly", "");
            textArea.style.position = "fixed";
            textArea.style.opacity = "0";
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            try {
                return document.execCommand("copy");
            } finally {
                textArea.remove();
            }
        }
    </script>
</body>
</html>
