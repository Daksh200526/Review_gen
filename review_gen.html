<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinic Review Generator</title>
    <!-- Tailwind CSS for modern, responsive card UI -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans min-h-screen p-4 md:p-8 flex items-center justify-center">
    <div class="max-w-2xl w-full bg-white p-6 md:p-8 rounded-2xl shadow-lg border border-gray-100">
        <h1 class="text-2xl font-bold mb-6 text-center text-blue-600">Share Your Experience</h1>
        
        <!-- Q1: Treatment (Single Choice) -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-3">1. What treatment did you take?</h2>
            <div id="treatments-container" class="grid grid-cols-2 gap-3"></div>
        </div>

        <!-- Q2: Doctor (Single Choice) -->
        <div class="mb-6">
            <h2 class="text-lg font-semibold mb-3">2. Which doctor did you consult?</h2>
            <div id="doctors-container" class="grid grid-cols-2 gap-3"></div>
        </div>

        <!-- Q3: Experience (Multiple Choice) -->
        <div class="mb-8">
            <h2 class="text-lg font-semibold mb-3">3. How was your experience? (Select all that apply)</h2>
            <div id="experiences-container" class="grid grid-cols-2 gap-3"></div>
        </div>

        <!-- Action Button -->
        <button id="generateBtn" onclick="generateReview()" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-md">
            Generate Review
        </button>

        <!-- Dynamic Output Section -->
        <div id="outputSection" class="hidden mt-6">
            <textarea id="reviewText" class="w-full h-32 p-4 border rounded-xl mb-4 bg-gray-50 focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none text-gray-700 shadow-inner" placeholder="Your review will appear here..."></textarea>
            
            <button onclick="copyAndRedirect(event)" class="w-full bg-green-600 hover:bg-green-700 text-white font-bold py-3 px-4 rounded-xl transition shadow-md flex justify-center items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
                Copy and Redirect
            </button>
        </div>
    </div>

    <script>
        // Update these two URLs to match your deployment & Google Maps link
        const BACKEND_URL = "https://your-app-name.onrender.com/generate-review";
        const REDIRECT_URL = "https://search.google.com/local/writereview?placeid=YOUR_PLACE_ID";

        // Option datasets
        const treatments = [
            "General Checkup",
            "Root Canal",
            "Teeth Whitening",
            "Dental Implants",
            "Orthodontics",
            "Tooth Extraction"
        ];

        const doctors = [
            "Dr. Sharma",
            "Dr. Patel",
            "Dr. Reddy",
            "Dr. Iyer",
            "Dr. Singh",
            "Dr. Rao"
        ];

        const experiences = [
            "Painless treatment",
            "Friendly staff",
            "Short wait time",
            "Clean environment",
            "Clear explanations",
            "Affordable pricing",
            "Gentle approach",
            "Modern equipment",
            "Great follow-up",
            "Highly recommended"
        ];

        // Fisher-Yates shuffle algorithm
        function shuffle(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        // Render shuffled items into containers on page load
        function renderOptions() {
            // Render Shuffled Treatments
            const treatmentContainer = document.getElementById("treatments-container");
            treatmentContainer.innerHTML = shuffle(treatments).map(t => `
                <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-blue-50 transition">
                    <input type="radio" name="treatment" value="${t}" class="w-4 h-4 text-blue-600">
                    <span class="text-sm md:text-base">${t}</span>
                </label>
            `).join('');

            // Render Shuffled Doctors
            const doctorContainer = document.getElementById("doctors-container");
            doctorContainer.innerHTML = shuffle(doctors).map(d => `
                <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-blue-50 transition">
                    <input type="radio" name="doctor" value="${d}" class="w-4 h-4 text-blue-600">
                    <span class="text-sm md:text-base">${d}</span>
                </label>
            `).join('');

            // Render Shuffled Experiences
            const expContainer = document.getElementById("experiences-container");
            expContainer.innerHTML = shuffle(experiences).map(e => `
                <label class="flex items-center gap-2 p-3 border rounded-lg cursor-pointer hover:bg-blue-50 transition">
                    <input type="checkbox" name="experience" value="${e}" class="w-4 h-4 text-blue-600 rounded">
                    <span class="text-sm md:text-base">${e}</span>
                </label>
            `).join('');
        }

        // Trigger shuffle rendering on page load/scan
        window.addEventListener("DOMContentLoaded", renderOptions);

        async function generateReview() {
            const treatment = document.querySelector('input[name="treatment"]:checked');
            const doctor = document.querySelector('input[name="doctor"]:checked');
            const selectedExps = Array.from(document.querySelectorAll('input[name="experience"]:checked')).map(cb => cb.value);

            if (!treatment || !doctor || selectedExps.length === 0) {
                alert("Please select a treatment, a doctor, and at least one experience item.");
                return;
            }

            const btn = document.getElementById('generateBtn');
            btn.innerText = "Generating...";
            btn.disabled = true;
            btn.classList.add("opacity-75", "cursor-not-allowed");

            try {
                const response = await fetch(BACKEND_URL, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        treatment: treatment.value,
                        doctor: doctor.value,
                        experience: selectedExps
                    })
                });

                if (!response.ok) throw new Error("Backend request failed");

                const data = await response.json();
                document.getElementById('reviewText').value = data.review;
                document.getElementById('outputSection').classList.remove('hidden');
            } catch (error) {
                alert("Failed to generate review. Please verify your Render service is running.");
                console.error(error);
            } finally {
                btn.innerText = "Generate Review";
                btn.disabled = false;
                btn.classList.remove("opacity-75", "cursor-not-allowed");
            }
        }

        async function copyAndRedirect(event) {
            const reviewText = document.getElementById('reviewText').value;
            if (!reviewText) return;

            try {
                await navigator.clipboard.writeText(reviewText);
                const btn = event.currentTarget;
                const originalText = btn.innerHTML;
                btn.innerHTML = "Copied! Redirecting...";
                
                setTimeout(() => {
                    window.open(REDIRECT_URL, "_blank");
                    btn.innerHTML = originalText;
                }, 1000);
            } catch (err) {
                alert("Clipboard copy failed. Please copy the text manually.");
            }
        }
    </script>
</body>
</html>
